<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Preference Tuning Under Domain Shift</title>
  <desc id="desc">Academic project page preview showing a trade-off between target-domain generalization and output diversity.</desc>
  <rect width="1200" height="630" fill="#f6f3ed"/>
  <circle cx="1130" cy="-70" r="305" fill="none" stroke="#1d5f7a" stroke-opacity=".13" stroke-width="72"/>
  <circle cx="40" cy="680" r="255" fill="#e5693f" fill-opacity=".07"/>

  <g transform="translate(74 66)">
    <rect width="114" height="34" rx="17" fill="#1d5f7a"/>
    <text x="57" y="22" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">EMNLP 2026</text>
  </g>

  <text x="74" y="183" fill="#17242c" font-family="Georgia, serif" font-size="66" font-weight="500">
    <tspan x="74" dy="0">Preference tuning</tspan>
    <tspan x="74" dy="74">under domain shift</tspan>
  </text>

  <text x="76" y="365" fill="#43515a" font-family="Arial, sans-serif" font-size="23">
    <tspan x="76" dy="0">Target-domain pseudo-labeling improves transfer—</tspan>
    <tspan x="76" dy="34">but its strongest gains can collapse output diversity.</tspan>
  </text>

  <g transform="translate(74 461)">
    <rect width="651" height="80" rx="15" fill="#17252b"/>
    <text x="24" y="30" fill="#8ccce2" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">GENERALIZATION</text>
    <line x1="153" y1="25" x2="487" y2="25" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="487" cy="25" r="5" fill="#e5693f"/>
    <text x="506" y="30" fill="#ffb79d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DIVERSITY</text>
    <text x="24" y="59" fill="#fff" fill-opacity=".7" font-family="Arial, sans-serif" font-size="16">3 testbeds · 6 objectives · 2 model families</text>
  </g>

  <g transform="translate(812 145)">
    <ellipse cx="148" cy="145" rx="145" ry="82" fill="none" stroke="#17242c" stroke-opacity=".22" stroke-dasharray="8 8" stroke-width="2"/>
    <line x1="54" y1="145" x2="242" y2="145" stroke="#17242c" stroke-opacity=".18" stroke-width="2"/>
    <rect x="0" y="119" width="108" height="52" rx="26" fill="#dcecf1"/>
    <text x="54" y="151" fill="#174d61" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">source</text>
    <rect x="188" y="119" width="108" height="52" rx="26" fill="#f7ded4"/>
    <text x="242" y="151" fill="#803821" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">target</text>
    <circle cx="148" cy="145" r="48" fill="#17252b"/>
    <text x="148" y="157" fill="#fffdf9" text-anchor="middle" font-family="Georgia, serif" font-size="38">π</text>
    <path d="M128 60 148 42l20 18" fill="none" stroke="#e5693f" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
    <text x="148" y="25" fill="#a93d21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">ADAPTATION SIGNAL</text>
  </g>

  <text x="1126" y="586" fill="#43515a" text-anchor="end" font-family="Arial, sans-serif" font-size="15">Karouzos · Tan · Aletras</text>
</svg>
